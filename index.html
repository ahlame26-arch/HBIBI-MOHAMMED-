<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مئة سبب أحبك من أجلها</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#151116;color:#fff;font-family:system-ui,-apple-system,"Noto Naskh Arabic",sans-serif}
.app{min-height:100vh;display:flex;flex-direction:column}
header{padding:12px 16px;text-align:center;background:#211821;position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0 0 4px}.count{opacity:.7;font-size:13px}
.reader{flex:1;display:flex;align-items:center;justify-content:center;padding:12px}
.book{position:relative;width:min(94vw,900px);height:min(78vh,720px);display:flex;align-items:center;justify-content:center;perspective:1800px}
.page{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 15px 50px #0008;background:#fff}
.controls{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:12px;background:#211821}
button,.file-btn{border:0;border-radius:999px;padding:10px 15px;background:#8f496b;color:white;font-size:14px}
button:disabled{opacity:.35}.primary{background:#b75d87}.qr{background:#5d6fae}
#qrBox{display:none;position:fixed;inset:0;background:#000d;z-index:20;align-items:center;justify-content:center;padding:20px}
.qrCard{background:#fff;color:#222;border-radius:18px;padding:18px;max-width:420px;width:100%;text-align:center}
video{width:100%;border-radius:12px;background:#111}#qrResult{word-break:break-all;margin:10px 0}
.close{background:#555}
.hint{text-align:center;opacity:.65;font-size:12px;padding:5px 10px}
</style>
</head>
<body>
<div class="app">
<header><h1>مئة سبب أحبك من أجلها</h1><div class="count" id="count"></div></header>
<div class="reader">
  <div class="book"><img id="pageImg" class="page" alt="صفحة الكتاب"></div>
</div>
<div class="controls">
  <button id="prev">‹ السابقة</button>
  <button id="read" class="primary">🔊 قراءة الصفحة</button>
  <button id="stop">⏹ إيقاف</button>
  <button id="next">التالية ›</button>
  <button id="qr" class="qr">📷 قراءة QR</button>
</div>
<div class="hint">يمكنك استعمال الأسهم أو السحب على الهاتف للتنقل بين الصفحات.</div>
</div>

<div id="qrBox">
 <div class="qrCard">
   <h2>قراءة QR Code</h2>
   <video id="video" autoplay playsinline></video>
   <div id="qrResult">وجّه الكاميرا نحو QR Code</div>
   <button id="closeQr" class="close">إغلاق</button>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="book-data.js"></script>
<script>
const total=BOOK_DATA.pages;
let current=0;
const img=document.getElementById('pageImg'), count=document.getElementById('count');
function render(){
  img.src=`pages/page-${String(current+1).padStart(3,'0')}.jpg`;
  count.textContent=`صفحة ${current+1} من ${total}`;
  prev.disabled=current===0; next.disabled=current===total-1;
  speechSynthesis.cancel();
}
const prev=document.getElementById('prev'), next=document.getElementById('next');
prev.onclick=()=>{if(current>0){current--;render()}};
next.onclick=()=>{if(current<total-1){current++;render()}};
document.getElementById('read').onclick=()=>{
  speechSynthesis.cancel();
  const t=BOOK_DATA.texts[current]||'';
  if(!t)return;
  const u=new SpeechSynthesisUtterance(t);
  u.lang='ar-SA'; u.rate=.9; u.pitch=1;
  speechSynthesis.speak(u);
};
document.getElementById('stop').onclick=()=>speechSynthesis.cancel();

let sx=0;
img.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
img.addEventListener('touchend',e=>{
 const dx=e.changedTouches[0].clientX-sx;
 if(Math.abs(dx)>50) dx<0?next.click():prev.click();
});
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')next.click();
 if(e.key==='ArrowRight')prev.click();
});

const box=document.getElementById('qrBox'), video=document.getElementById('video'), result=document.getElementById('qrResult');
let stream=null, raf=null;
document.getElementById('qr').onclick=async()=>{
 box.style.display='flex'; result.textContent='وجّه الكاميرا نحو QR Code';
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
  video.srcObject=stream; scan();
 }catch(e){result.textContent='خاصك تسمح للمتصفح باستعمال الكاميرا.'}
};
function scan(){
 if(video.readyState>=2){
  const c=document.createElement('canvas'), x=c.getContext('2d');
  c.width=video.videoWidth; c.height=video.videoHeight;
  x.drawImage(video,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height);
  const code=jsQR(d.data,d.width,d.height);
  if(code){
   result.innerHTML='تم العثور على QR: <a href="'+escapeHtml(code.data)+'" target="_blank" rel="noopener">'+escapeHtml(code.data)+'</a>';
   stopCamera(); return;
  }
 }
 raf=requestAnimationFrame(scan);
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function stopCamera(){
 if(raf)cancelAnimationFrame(raf);
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;
}
document.getElementById('closeQr').onclick=()=>{stopCamera();box.style.display='none'};
render();
</script>

<script>
(function () {
  let audioCtx = null;
  function pageTurnSound() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();

      const now = audioCtx.currentTime;
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      const osc = audioCtx.createOscillator();

      // Short paper-like "swish"
      osc.type = "triangle";
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(65, now + 0.16);

      filter.type = "bandpass";
      filter.frequency.setValueAtTime(1100, now);
      filter.Q.value = 0.7;

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.055, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.19);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.2);
    } catch(e) {}
  }

  // Expose for the existing navigation code.
  window.playPageTurnSound = pageTurnSound;

  // Play when page navigation buttons are used.
  document.addEventListener("click", function(e) {
    if (e.target.closest("#prevBtn, #nextBtn, .prev, .next, [data-action='prev'], [data-action='next']")) {
      pageTurnSound();
    }
  });

  // Play on keyboard page turns.
  document.addEventListener("keydown", function(e) {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "PageUp" || e.key === "PageDown") {
      pageTurnSound();
    }
  });
})();
</script>

</body>
</html>
