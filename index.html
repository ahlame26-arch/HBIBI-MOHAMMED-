<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مئة سبب أحبك من أجلها</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#151116;color:#fff;font-family:system-ui,-apple-system,"Noto Naskh Arabic",sans-serif}
.app{min-height:100vh;display:flex;flex-direction:column}
header{padding:12px 16px;text-align:center;background:#211821;position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0 0 4px}.count{opacity:.7;font-size:13px}
.reader{flex:1;display:flex;align-items:center;justify-content:center;padding:12px}
.book{position:relative;width:min(94vw,900px);height:min(78vh,720px);display:flex;align-items:center;justify-content:center}
.page{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 15px 50px #0008;background:#fff;object-fit:contain}
.controls{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:12px;background:#211821}
button{border:0;border-radius:999px;padding:10px 15px;background:#8f496b;color:white;font-size:14px}
button:disabled{opacity:.35}
.primary{background:#b75d87}
.hint{text-align:center;opacity:.65;font-size:12px;padding:5px 10px 10px;background:#211821}
.error{display:none;color:#ffb5b5;text-align:center;font-size:13px;padding:8px}
</style>
</head>
<body>
<div class="app">
<header>
<h1>مئة سبب أحبك من أجلها</h1>
<div class="count" id="count"></div>
</header>

<div class="reader">
<div class="book">
<img id="pageImg" class="page" alt="صفحة الكتاب">
</div>
</div>

<div id="error" class="error">الصورة غير موجودة في المستودع.</div>

<div class="controls">
<button id="prev">‹ السابقة</button>
<button id="next" class="primary">التالية ›</button>
</div>

<div class="hint">استعملي الأسهم أو اسحبي الصفحة على الهاتف للتنقل.</div>
</div>

<script>
const total = 116;
let current = 0;

const img = document.getElementById('pageImg');
const count = document.getElementById('count');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const errorBox = document.getElementById('error');

function pagePath(n){
  return 'page-' + String(n).padStart(3,'0') + '.jpg';
}

function render(){
  const path = pagePath(current + 1);
  errorBox.style.display = 'none';
  img.src = path;
  count.textContent = `صفحة ${current + 1} من ${total}`;
  prev.disabled = current === 0;
  next.disabled = current === total - 1;
}

img.onerror = function(){
  errorBox.style.display = 'block';
  errorBox.textContent = 'ما لقيتش ' + pagePath(current + 1) + ' فالمستودع.';
};

function turnSound(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + .14);
    gain.gain.setValueAtTime(.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.045, ctx.currentTime + .01);
    gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .16);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + .17);
  }catch(e){}
}

prev.onclick = () => {
  if(current > 0){ current--; turnSound(); render(); }
};
next.onclick = () => {
  if(current < total - 1){ current++; turnSound(); render(); }
};

let sx = 0;
img.addEventListener('touchstart', e => {
  sx = e.touches[0].clientX;
}, {passive:true});

img.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if(Math.abs(dx) > 50){
    if(dx < 0) next.click();
    else prev.click();
  }
});

document.addEventListener('keydown', e => {
  if(e.key === 'ArrowLeft') next.click();
  if(e.key === 'ArrowRight') prev.click();
});

render();
</script>
</body>
</html>
